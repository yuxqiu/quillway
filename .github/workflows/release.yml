name: Release

# Publishing a GitHub release (tag `vX.Y.Z`) builds Linux binaries and
# attaches them, with checksums, to that release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Tag matches the crate version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Compare
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match the workspace version $version in Cargo.toml"
            exit 1
          fi

  build:
    name: Build (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an older glibc baseline (2.35), so the binary runs on more distros.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      # Ensures rustup exists; the toolchain itself comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p quillway
      - name: Smoke test
        run: |
          target/release/quillway --version
          target/release/quillway models list
      - name: Package
        id: package
        run: |
          name="quillway-${TAG}-${{ matrix.arch }}-linux"
          mkdir "$name"
          cp target/release/quillway README.md LICENSE-APACHE LICENSE-MIT "$name/"
          tar --create --gzip --file "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "files=$name.tar.gz $name.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ steps.package.outputs.files }} --clobber --repo "$GITHUB_REPOSITORY"
