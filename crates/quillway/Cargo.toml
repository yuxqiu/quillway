[package]
name = "quillway"
description = "Shortcut-summoned local-LLM rewrite popup for Wayland (layer-shell)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
quillway-core.workspace = true
quillway-engine.workspace = true
quillway-wl.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rustix = { version = "1", features = ["process"] }
# `advanced`: the widget trait, for `ui::no_ctrl_typing`.
iced = { version = "0.14", features = ["tokio", "advanced", "canvas"] }
iced_exwlshell = "=0.20.1"

[lints]
workspace = true

[dev-dependencies]
iced_runtime = "0.14"
tempfile = "3"
