[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuxqiu/quillway"

# Same lint set as ../zippel. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
wildcard_imports = "allow"
uninlined_format_args = "allow"
similar_names = "allow"
too_many_lines = "allow"
many_single_char_names = "allow"

[workspace.dependencies]
quillway-core = { path = "crates/quillway-core" }
quillway-engine = { path = "crates/quillway-engine" }
quillway-wl = { path = "crates/quillway-wl" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "process",
  "time",
  "fs",
  "sync",
] }

# iced 0.14.0 plus upstream ed36c6e1, which stops iced_wgpu choosing 10:10:10:2 surfaces: their
# 2-bit alpha erased the popup's shadow and translucency on Mesa (DECISIONS #52,
# docs/research/surface-format-alpha.md). Drop this when a released iced has the fix.
[patch.crates-io]
iced_wgpu = { git = "https://github.com/yuxqiu/iced", rev = "77e7f24f5ef4e58c670519bb5c1ccf058b4eb121" }
iced_graphics = { git = "https://github.com/yuxqiu/iced", rev = "77e7f24f5ef4e58c670519bb5c1ccf058b4eb121" }
iced_core = { git = "https://github.com/yuxqiu/iced", rev = "77e7f24f5ef4e58c670519bb5c1ccf058b4eb121" }
iced_futures = { git = "https://github.com/yuxqiu/iced", rev = "77e7f24f5ef4e58c670519bb5c1ccf058b4eb121" }
iced_debug = { git = "https://github.com/yuxqiu/iced", rev = "77e7f24f5ef4e58c670519bb5c1ccf058b4eb121" }
